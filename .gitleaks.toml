title = "cachet-core"

[extend]
useDefault = true

# Global allowlist uses [allowlist] in gitleaks 8.24.x (not [[allowlists]]).
[allowlist]
description = "Tests, docs, agent skill examples, and package config fixtures"
paths = [
    '''(^|/)tests/''',
    '''(^|/)docs/''',
    '''(^|/)\.agents/''',
    '''(^|/)workbench/''',
    '''(^|/)\.env\.example$''',
    '''(^|/)\.gitleaks\.toml$''',
    '''(^|/)phpunit\.xml''',
]
